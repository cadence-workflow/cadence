name: Restrict Workflow Changes

# Only authors with write access (maintainers) may change GitHub Actions
# workflows, because workflows control CI and can read the repo secrets.
# pull_request_target runs this file from the base branch, so a PR cannot change
# the check. The checkout also uses the base branch. Do not check out or run PR
# code here.
# There is no paths filter, so the job also runs after the author reverts the
# workflow changes and can remove the warning comment.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  check-author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
      - name: Check that the author has write access
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require("./.github/scripts/restrict-workflow-changes.js");
            await run({ github, context, core });
