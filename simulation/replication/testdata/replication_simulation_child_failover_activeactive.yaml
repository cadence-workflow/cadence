# Test the adoption and the stale branch replacement of child workflows in an active-active domain.
#
# A child gets the active cluster selection policy of its parent, so the children fail over with the region of their
# parent. Region0 and region1 start on cluster0 and fail over to cluster1 at different times. Region2 is on cluster1
# and has no workflows. It makes the domain active on cluster1 from the start, so the polls of the worker of cluster1
# can get decision tasks. A poll that starts when the domain is not active on the cluster gets only queries until it
# times out, and matching does not disconnect the polls of active-active domains at a failover.
# Active-active domains do not reschedule the pending standby tasks at a failover, so cluster1 processes them at the
# next redispatch, which can be up to ~30s later.
#
# aa-adoption-region0-parent is in region0. Replication of shard 3 (shard of the parent) sends one task per batch and
# waits 30s per batch, see the dynamic config.
# 1. At ~1s cluster0 writes the initiated events, starts the children and records their start in the parent. The
#    children run for 170s.
# 2. Cluster1 gets one task of the parent every 30s. When it has the child initiated events of the parent, region0
#    fails over to cluster1. The next task of the parent, with the first child started event, arrives at least 30s
#    later, so cluster1 does not have the child started events when region0 becomes active on it.
# 3. Up to ~30s after the failover, cluster1 starts the children again with the same deterministic request ID, finds
#    the running runs that cluster0 started and returns them to the parent.
#
# aa-stale-branch-running-parent is in region1. Replication of shard 0 (shard of the parent) sends one task per batch
# and waits 20s per batch, see the dynamic config. The parent holds its decision task with a local activity on the
# worker of cluster0 only. The worker heartbeats the decision every ~4s, and each heartbeat adds a replication task, so
# cluster1 gets the events of the parent later and later.
# 1. At ~50s cluster0 completes the decision with the initiated events (N) and starts the children.
#    They run for ~60s.
# 2. At 65s region1 fails over to cluster1. At ~75s to ~95s cluster1 still sees the decision of the parent in flight
#    and fails it with FAILOVER_CLOSE_DECISION. The new events move the event IDs of the parent.
# 3. Soon after, cluster1 writes the initiated events (N') and starts the children again. The running runs were started
#    from the initiated events N, which are not on the current branch, so the child start terminates them and starts
#    a new execution.
#
# The children of both parents are on shards 1 and 2, so they replicate to cluster1 without delay.
# Without the deterministic request ID and the stale branch replacement, the child starts fail with already started,
# and the parents fail.
# To check that the paths ran:
# in the history of aa-adoption-region0-parent on cluster1, the started events have the version of cluster1, and the
# child runs have the version of cluster0.
# curl -s localhost:8002/metrics | grep child_workflow_stale_branch_replaced

clusters:
  cluster0:
    grpcEndpoint: "cadence-cluster0:7833"
  cluster1:
    grpcEndpoint: "cadence-cluster1:7833"

primaryCluster: "cluster0"

domains:
  test-domain-aa:
    activeClusterName: cluster0
    clusterAttributes:
      region:
        region0: cluster0
        region1: cluster0
        region2: cluster1

operations:
  # the children aa-adopted-child-0 to 3 are on shards 1 and 2
  - op: start_workflow
    at: 0s
    workflowType: child-workflow-loop
    workflowID: aa-adoption-region0-parent
    cluster: cluster0
    domain: test-domain-aa
    workflowExecutionStartToCloseTimeout: 400s
    childWorkflowID: aa-adopted-child
    childWorkflowCount: 4
    childWorkflowTimeout: 300s
    childWorkflowDuration: 170s
    activeClusterSelectionPolicy:
      clusterAttribute:
        scope: region
        name: region0

  # the children aa-stale-branch-running-child-0 to 3 are on shards 1 and 2
  - op: start_workflow
    at: 0s
    workflowType: child-workflow-loop
    workflowID: aa-stale-branch-running-parent
    cluster: cluster0
    domain: test-domain-aa
    workflowExecutionStartToCloseTimeout: 400s
    childWorkflowID: aa-stale-branch-running-child
    childWorkflowCount: 4
    childWorkflowDuration: 60s
    childWorkflowTimeout: 300s
    decisionHoldDuration: 50s
    decisionHoldCluster: cluster0
    activeClusterSelectionPolicy:
      clusterAttribute:
        scope: region
        name: region1

  - op: change_active_clusters
    at: 65s
    domain: test-domain-aa
    newClusterAttributes:
      region:
        region0: cluster0
        region1: cluster1
        region2: cluster1

  # the initiated events arrive at ~60s to ~95s
  - op: wait_for_history_event
    at: 66s
    workflowID: aa-adoption-region0-parent
    cluster: cluster1
    domain: test-domain-aa
    eventType: StartChildWorkflowExecutionInitiated
    eventCount: 4
    timeout: 100s

  # runs as soon as the wait above returns, and at least 5s after the failover of region1 because of the failover
  # cool down
  - op: change_active_clusters
    at: 71s
    domain: test-domain-aa
    newClusterAttributes:
      region:
        region0: cluster1
        region1: cluster1
        region2: cluster1

  # the simulator has a go test timeout of 240s that includes the setup, so the validation must be earlier.
  # The parents close at ~145s to ~160s and at ~175s.
  - op: validate
    at: 170s
    workflowID: aa-stale-branch-running-parent
    cluster: cluster1
    domain: test-domain-aa
    want:
      status: completed

  # cluster1 must fail the decision of the stale branch parent at the failover, otherwise the test does not create the
  # stale branch
  - op: wait_for_history_event
    at: 171s
    workflowID: aa-stale-branch-running-parent
    cluster: cluster1
    domain: test-domain-aa
    eventType: DecisionTaskFailed
    eventCount: 1
    timeout: 5s

  - op: validate
    at: 185s
    workflowID: aa-adoption-region0-parent
    cluster: cluster1
    domain: test-domain-aa
    want:
      status: completed
