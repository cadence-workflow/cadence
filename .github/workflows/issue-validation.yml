name: Issue Validation

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - reopened

permissions:
  issues: write

jobs:
  validate-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate issue template requirements
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require("./.github/scripts/validate-issue.js");
            await run({ github, context });
