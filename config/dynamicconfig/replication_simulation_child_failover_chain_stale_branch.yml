# This file is used as dynamicconfig override for "child_failover_chain_stale_branch" replication simulation scenario configured via simulation/replication/testdata/replication_simulation_child_failover_chain_stale_branch.yaml
system.writeVisibilityStoreName:
  - value: "db"
system.readVisibilityStoreName:
  - value: "db"
history.replicatorTaskBatchSize:
  - value: 25
    constraints: {}
history.replicatorMinTaskBatchSize: # one task per batch for shards 1 and 2, the shards of the parents
  - value: 1
    constraints:
      shardID: 1
  - value: 1
    constraints:
      shardID: 2
history.replicatorMaxTaskBatchSize:
  - value: 1
    constraints:
      shardID: 1
  - value: 1
    constraints:
      shardID: 2
frontend.failoverCoolDown:
  - value: 5s
history.ReplicationTaskProcessorStartWait: # wait before each replication batch. Shards 1 and 2 are the shards of the parents.
  - value: 20s
    constraints:
      shardID: 1
  - value: 20s
    constraints:
      shardID: 2
  - value: 10ms
history.ReplicationTaskProcessorStartWaitJitterCoefficient: # no jitter, so that the wait of shards 1 and 2 is always 20s
  - value: 0
    constraints:
      shardID: 1
  - value: 0
    constraints:
      shardID: 2
history.enableDeterministicChildWorkflowRequestID:
  - value: true
history.enableExistingChildWorkflowRunHandling:
  - value: true
history.enableChildWorkflowStaleBranchReplacement:
  - value: true
