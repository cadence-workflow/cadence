# This file is used as dynamicconfig override for "child_failover_activeactive" replication simulation scenario configured via simulation/replication/testdata/replication_simulation_child_failover_activeactive.yaml
system.writeVisibilityStoreName:
  - value: "db"
system.readVisibilityStoreName:
  - value: "db"
history.replicatorTaskBatchSize:
  - value: 25
    constraints: {}
history.replicatorMinTaskBatchSize: # one task per batch for shard 0 (aa-stale-branch-running-parent) and shard 3 (aa-adoption-region0-parent)
  - value: 1
    constraints:
      shardID: 0
  - value: 1
    constraints:
      shardID: 3
history.replicatorMaxTaskBatchSize:
  - value: 1
    constraints:
      shardID: 0
  - value: 1
    constraints:
      shardID: 3
frontend.failoverCoolDown:
  - value: 5s
history.ReplicationTaskProcessorStartWait: # wait before each replication batch of shards 0 and 3
  - value: 20s
    constraints:
      shardID: 0
  - value: 30s
    constraints:
      shardID: 3
  - value: 10ms
history.ReplicationTaskProcessorStartWaitJitterCoefficient: # no jitter, so that the waits of shards 0 and 3 are always the same
  - value: 0
    constraints:
      shardID: 0
  - value: 0
    constraints:
      shardID: 3
frontend.enableActiveClusterSelectionPolicyInStartWorkflow:
  - value: true
history.enableDeterministicChildWorkflowRequestID:
  - value: true
history.enableExistingChildWorkflowRunHandling:
  - value: true
history.enableChildWorkflowStaleBranchReplacement:
  - value: true
