name: Restrict Workflow Changes

# Only authors with write access (maintainers) may change GitHub Actions
# workflows, because workflows control CI and can read the repo secrets.
# pull_request_target runs this file from the base branch, so a PR cannot change
# the check. Do not check out or run PR code here.
# There is no paths filter, so the job also runs after the author reverts the
# workflow changes and can remove the warning comment.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  check-author:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the author has write access
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = "<!-- restrict-workflow-changes -->";
            const ALLOWED = ["admin", "maintain", "write"];
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const workflowFiles = files
              .map((f) => f.filename)
              .filter((name) => name.startsWith(".github/workflows/"));

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.includes(MARKER),
            );

            if (workflowFiles.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            // Includes access granted through teams, for example cadence-dev.
            let permission = "none";
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: author,
              });
              permission = data.permission;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (ALLOWED.includes(permission)) {
              core.info(`${author} has ${permission} access, workflow changes are allowed`);
              return;
            }

            const body = [
              MARKER,
              "⚠️ **Workflow changes require maintainer authorship**",
              "",
              "This PR modifies the following GitHub Actions workflow file(s):",
              ...workflowFiles.map((name) => `- \`${name}\``),
              "",
              "Only repository maintainers can change `.github/workflows/`, because these files control CI execution and have access to repo secrets.",
              "",
              "**Please:**",
              "1. Revert the workflow changes from this PR so the rest can be reviewed.",
              `2. Open a [new issue](https://github.com/${owner}/${repo}/issues/new) that describes the workflow change you want, and a maintainer will make it in a separate PR.`,
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }

            core.setFailed(
              `${author} has ${permission} access and cannot change workflow files`,
            );
