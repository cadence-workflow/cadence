name: Check too-fresh dependencies
on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'

jobs:
  check-too-fresh-deps:
    name: Check too-fresh dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Download modules
        run: go mod download

      - name: Check for too-fresh dependencies
        run: ./scripts/check-too-fresh-deps.sh
